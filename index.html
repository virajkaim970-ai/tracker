<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>📚 Study Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#faf5ea;--p:#fffdf8;--p2:#f5eddc;--ink:#3a2e1f;--ink2:#6b5842;--mut:#9b8a70;--ln:#e5d9c0;--ln2:#d4c4a3;--acc:#8b5a2b;--gold:#b8860b;--grn:#5a7d3f;--red:#b04a4a;--blu:#4a6b8a;--pur:#7a5aaa;--pnk:#a05a7a;--teal:#3a7a7a}
body.dark{--bg:#0f1216;--p:#181c24;--p2:#1e242e;--ink:#e8e0d0;--ink2:#b8a890;--mut:#7a7565;--ln:#2a3140;--ln2:#3a4252;--acc:#d4a05a;--gold:#e0b060;--grn:#8fc47a;--red:#e08080;--blu:#8ab0d0;--pur:#a78bfa;--pnk:#e08aaa;--teal:#7ac8c8}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,system-ui,sans-serif;font-size:14px;line-height:1.5;padding:16px 12px 60px;max-width:1080px;margin:auto;transition:.2s}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--gold));display:grid;place-items:center;font-size:19px}
.brand h1{font-family:Georgia,serif;font-size:17px}
.brand p{font-size:11px;color:var(--mut)}
nav{display:flex;gap:3px;padding:3px;background:var(--p);border:1px solid var(--ln);border-radius:10px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;color:var(--ink2);font:inherit;font-size:12.5px;padding:7px 13px;border-radius:7px;cursor:pointer;font-weight:500;white-space:nowrap}
nav button.on{background:var(--acc);color:#fff;font-weight:600}
.acts{display:flex;gap:5px}
.btn{font:inherit;font-size:12.5px;padding:8px 11px;border-radius:8px;cursor:pointer;border:1px solid var(--ln2);background:var(--p);color:var(--ink)}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.panel{display:none}.panel.on{display:block}
.card{background:var(--p);border:1px solid var(--ln);border-radius:12px;padding:14px 16px;margin-bottom:11px}
.card h3{font-family:Georgia,serif;font-size:12px;color:var(--ink2);text-transform:uppercase;letter-spacing:1px;margin-bottom:11px;display:flex;align-items:center;gap:6px}
.card h3::before{content:'❋';color:var(--gold);font-size:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}
.stat{background:var(--p2);border:1px solid var(--ln);border-radius:10px;padding:11px}
.stat .lb{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.7px;font-weight:600}
.stat .vl{font-family:Georgia,serif;font-size:22px;font-weight:700;margin-top:4px;display:block;line-height:1.1}
.stat .vl small{font-size:11px;color:var(--mut);font-weight:500}
.bar{height:5px;background:var(--ln);border-radius:99px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .4s}
.chartbox{position:relative;height:240px}
.chart-fallback{text-align:center;color:var(--mut);padding:80px 10px;font-size:13px;line-height:1.7}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:11px}
@media(max-width:800px){.grid2{grid-template-columns:1fr}}

/* Subject radar grid */
.radar-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:11px}
.radar-card{background:var(--p2);border:1px solid var(--ln);border-radius:10px;padding:12px 10px 8px}
.radar-card .title{display:flex;justify-content:space-between;align-items:center;padding:0 4px 6px;font-family:Georgia,serif;font-weight:700;font-size:13.5px}
.radar-card .title span:last-child{font-family:-apple-system,system-ui,sans-serif;font-weight:500;font-size:11px;color:var(--mut)}
.radar-card .rbox{position:relative;height:230px}

.subj-bar{margin-bottom:14px}
.subj-bar .row1{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
.subj-bar .row1 b{font-family:Georgia,serif;font-size:13.5px}
.subj-bar .row1 span{color:var(--mut);font-size:11.5px}
.subj-bar .bar{height:8px;margin-top:0}
.ch{display:flex;align-items:center;gap:8px;padding:8px 11px;margin-bottom:4px;background:var(--p2);border:1px solid var(--ln);border-radius:9px;flex-wrap:wrap;font-size:13px}
.ch .nm{flex:1;min-width:130px;font-weight:500}
.metrics{display:flex;gap:3px;flex-wrap:wrap}
.met{font-size:10px;padding:4px 8px;border-radius:5px;cursor:pointer;font-weight:700;background:var(--p);border:1px solid var(--ln);color:var(--mut);letter-spacing:.3px}
.met:hover{border-color:var(--acc)}
.met.on{color:#fff}
.met[data-k="c"].on{background:var(--grn);border-color:var(--grn)}
.met[data-k="r1"].on{background:var(--blu);border-color:var(--blu)}
.met[data-k="r2"].on{background:var(--pur);border-color:var(--pur)}
.met[data-k="q"].on{background:var(--gold);border-color:var(--gold)}
.met[data-k="n"].on{background:var(--pnk);border-color:var(--pnk)}
.subj-hdr{display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px;font-family:Georgia,serif;font-weight:700;font-size:14px}
.subj-hdr .mini{font-size:11px;color:var(--mut);font-weight:500;font-family:-apple-system,system-ui,sans-serif}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;background:var(--p2);border:1px solid var(--ln);border-radius:8px;padding:7px 10px;color:var(--ink);outline:none;font-size:13px}
input:focus,textarea:focus{border-color:var(--acc)}
.pill{font:inherit;font-size:12px;padding:6px 12px;border-radius:99px;cursor:pointer;background:var(--p2);border:1px solid var(--ln);color:var(--ink2)}
.pill.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.task{display:flex;align-items:center;gap:9px;padding:9px 11px;margin-bottom:4px;background:var(--p2);border:1px solid var(--ln);border-radius:9px;font-size:13px}
.task.done{border-left:3px solid var(--grn)}
.chk{width:19px;height:19px;flex:none;border-radius:5px;border:2px solid var(--ln2);background:none;cursor:pointer;color:transparent;font-size:11px;font-weight:900;display:grid;place-items:center;padding:0}
.task.done .chk{background:var(--grn);border-color:var(--grn);color:#fff}
.task .tx{flex:1}
.task.done .tx{color:var(--mut);text-decoration:line-through}
.del{background:none;border:0;color:var(--mut);font-size:17px;cursor:pointer;padding:0 3px}
.del:hover{color:var(--red)}
.empty{color:var(--mut);font-size:13px;text-align:center;padding:26px 10px}
.empty .big{font-size:30px;margin-bottom:6px;opacity:.4}
.date-hdr{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.8px;font-weight:700;margin:12px 0 6px}
#toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,100px);background:var(--ink);color:var(--bg);padding:10px 17px;border-radius:10px;font-size:12.5px;opacity:0;transition:.3s;pointer-events:none;z-index:999}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">📚</div>
    <div><h1>Study Tracker</h1><p id="tag">Loading…</p></div>
  </div>
  <nav>
    <button data-t="dash" class="on">Dashboard</button>
    <button data-t="ch">Chapters</button>
    <button data-t="tk">Tasks</button>
  </nav>
  <div class="acts">
    <button id="themeBtn" class="btn">🌙</button>
    <button class="btn" id="exp" title="Export">⬇</button>
    <button class="btn" id="imp" title="Import">⬆</button>
    <input type="file" id="file" hidden accept=".json">
  </div>
</header>

<section id="dash" class="panel on">
  <div class="stats" id="stats" style="margin-bottom:11px"></div>
  <div class="card">
    <h3>Task Completion — Last 30 Days</h3>
    <div class="chartbox"><canvas id="c1"></canvas></div>
  </div>
  <div class="card">
    <h3>Subject Strength — 5 Areas Per Subject</h3>
    <div class="radar-grid" id="radarGrid"></div>
  </div>
  <div class="card"><h3>Subject Progress</h3><div id="subjBars"></div></div>
</section>

<section id="ch" class="panel">
  <div class="card">
    <div class="row" style="margin-bottom:11px">
      <span style="font-size:12.5px;color:var(--mut);font-weight:600">Filter:</span>
      <button class="pill on" data-fsub="all">All</button>
      <button class="pill" data-fsub="Physics">Physics</button>
      <button class="pill" data-fsub="Physical Chemistry">Physical Chem</button>
      <button class="pill" data-fsub="Organic Chemistry">Organic Chem</button>
      <button class="pill" data-fsub="Inorganic Chemistry">Inorganic Chem</button>
      <button class="pill" data-fsub="Mathematics">Mathematics</button>
    </div>
    <div id="chlist"></div>
    <p style="font-size:11.5px;color:var(--mut);margin-top:12px;line-height:1.7">
      <b>Done</b> = chapter completed · <b>R1</b> = revised once · <b>R2</b> = revised twice ·
      <b>Q</b> = questions practiced · <b>N</b> = short notes made
    </p>
  </div>
</section>

<section id="tk" class="panel">
  <div class="card">
    <div class="row" style="margin-bottom:11px">
      <input type="date" id="td">
      <input type="text" id="ti" placeholder="What to do?" style="flex:1;min-width:150px">
      <button class="btn pri" id="add">+ Add</button>
    </div>
    <div class="row" style="margin-bottom:11px">
      <span style="font-size:12.5px;color:var(--mut);font-weight:600">Range:</span>
      <button class="pill on" data-range="day">Today</button>
      <button class="pill" data-range="week">This Week</button>
      <button class="pill" data-range="month">This Month</button>
      <button class="pill" data-range="all">All</button>
    </div>
    <div id="tlist"></div>
  </div>
</section>

<div id="toast"></div>

<script>
/* ═══ FULL JEE SYLLABUS ═══ */
const SYL = {
  Physics: [
    "Units & Measurements","Kinematics 1D","Kinematics 2D & Projectile","Laws of Motion","Friction",
    "Circular Motion","Work Energy & Power","Center of Mass & Collisions","Rotational Motion","Gravitation",
    "Mechanical Properties of Solids","Mechanical Properties of Fluids","Thermal Properties of Matter",
    "Thermodynamics","Kinetic Theory of Gases","Simple Harmonic Motion","Waves & Sound","Electrostatics",
    "Capacitance","Current Electricity","Moving Charges & Magnetism","Magnetism & Matter",
    "Electromagnetic Induction","Alternating Current","Electromagnetic Waves","Ray Optics","Wave Optics",
    "Dual Nature of Radiation","Atoms","Nuclei","Semiconductors","Experimental Physics"
  ],
  "Physical Chemistry": [
    "Some Basic Concepts of Chemistry","Mole Concept","Structure of Atom","Gaseous State",
    "Thermodynamics","Thermochemistry","Chemical Equilibrium","Ionic Equilibrium","Redox Reactions",
    "Solutions","Electrochemistry","Chemical Kinetics","Surface Chemistry","Solid State",
    "Nuclear Chemistry","States of Matter"
  ],
  "Organic Chemistry": [
    "Basics of Organic Chemistry (GOC)","Isomerism","Stereochemistry","Reaction Mechanism",
    "Hydrocarbons","Haloalkanes & Haloarenes","Alcohols, Phenols & Ethers","Aldehydes & Ketones",
    "Carboxylic Acids","Amines","Biomolecules","Polymers","Chemistry in Everyday Life",
    "Named Reactions","Practical Organic Chemistry"
  ],
  "Inorganic Chemistry": [
    "Periodic Table & Periodicity","Chemical Bonding & Molecular Structure","Hydrogen & s-Block Elements",
    "p-Block (Group 13 & 14)","p-Block (Group 15, 16, 17, 18)","d-Block & Transition Elements",
    "f-Block Elements","Coordination Compounds","Metallurgy","Qualitative Analysis",
    "Environmental Chemistry","Practical Inorganic Chemistry"
  ],
  Mathematics: [
    "Sets & Relations","Functions","Trigonometric Ratios & Identities","Trigonometric Equations",
    "Inverse Trigonometric Functions","Complex Numbers","Quadratic Equations","Sequences & Series",
    "Permutations & Combinations","Binomial Theorem","Matrices","Determinants","Straight Lines",
    "Circles","Parabola","Ellipse","Hyperbola","Limits & Continuity","Differentiation",
    "Application of Derivatives","Indefinite Integration","Definite Integration","Area Under Curves",
    "Differential Equations","Vectors","3D Geometry","Probability","Statistics",
    "Mathematical Reasoning","Linear Programming"
  ]
};

const METRICS = [
  {k:'c', lbl:'Done', full:'Chapter Completed', color:'#5a7d3f'},
  {k:'r1', lbl:'R1', full:'Revised Once', color:'#4a6b8a'},
  {k:'r2', lbl:'R2', full:'Revised Twice', color:'#7a5aaa'},
  {k:'q', lbl:'Q', full:'Questions Practiced', color:'#b8860b'},
  {k:'n', lbl:'N', full:'Short Notes Made', color:'#a05a7a'}
];

const SUBS = Object.keys(SYL);
const SCLR = {
  Physics: "#4a6b8a",
  "Physical Chemistry": "#5a7d3f",
  "Organic Chemistry": "#7a5aaa",
  "Inorganic Chemistry": "#3a7a7a",
  Mathematics: "#b8860b"
};
const KEY = "study-tracker-v5";

/* ═══ STATE ═══ */
let S = {};
try { S = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e) { S = {}; }
S.ch = S.ch || {};
S.tk = S.tk || {};

const save = () => {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e) { toast("⚠ Storage full — export a backup!"); }
};

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const pad = n => String(n).padStart(2, '0');
const fmt = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => fmt(new Date());

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(t._);
  t._ = setTimeout(() => t.classList.remove("on"), 2000);
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function chState(sub, name) {
  const k = sub + '|' + name;
  if (!S.ch[k]) S.ch[k] = { c:false, r1:false, r2:false, q:false, n:false };
  return S.ch[k];
}

/* ═══ STATS ═══ */
function subjectStats(sub) {
  const total = SYL[sub].length;
  const cnt = {c:0, r1:0, r2:0, q:0, n:0};
  SYL[sub].forEach(name => {
    const st = S.ch[sub + '|' + name];
    if (!st) return;
    if (st.c) cnt.c++;
    if (st.r1) cnt.r1++;
    if (st.r2) cnt.r2++;
    if (st.q) cnt.q++;
    if (st.n) cnt.n++;
  });
  const pct = {};
  METRICS.forEach(m => pct[m.k] = total ? cnt[m.k] / total * 100 : 0);
  const overall = total
    ? (cnt.c + cnt.r1 + cnt.r2 + cnt.q + cnt.n) / (total * METRICS.length) * 100
    : 0;
  return { total, cnt, pct, overall };
}

function taskStats(from, to) {
  let total = 0, done = 0;
  Object.keys(S.tk).forEach(k => {
    if (k >= from && k <= to) {
      const arr = S.tk[k] || [];
      total += arr.length;
      done += arr.filter(t => t.done).length;
    }
  });
  return { total, done, pct: total ? done / total * 100 : 0 };
}

function currentStreak() {
  const has = k => (S.tk[k] || []).some(t => t.done);
  const d = new Date();
  if (!has(fmt(d))) d.setDate(d.getDate() - 1);
  let n = 0;
  while (has(fmt(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

/* ═══ CHARTS ═══ */
const charts = {};
const HAS_CHART = typeof Chart !== "undefined";
if (HAS_CHART) {
  Chart.defaults.color = "#9b8a70";
  Chart.defaults.font.family = "Georgia,serif";
  Chart.defaults.font.size = 11;
}
const gridC = { color: "#e5d9c0", drawBorder: false };
const tickC = { color: "#9b8a70" };

/* Task line chart */
function drawTaskChart() {
  if (!HAS_CHART) return;
  if (charts.c1) charts.c1.destroy();
  const labels = [], data = [];
  for (let i = 29; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const k = fmt(d);
    const arr = S.tk[k] || [];
    labels.push(d.getDate() + '/' + (d.getMonth() + 1));
    data.push(arr.length ? arr.filter(t => t.done).length / arr.length * 100 : 0);
  }
  charts.c1 = new Chart($("#c1"), {
    type: "line",
    data: { labels, datasets: [{
      data, borderColor: "#8b5a2b", backgroundColor: "#8b5a2b30",
      borderWidth: 2.5, tension: .35, fill: true,
      pointRadius: 2.5, pointBackgroundColor: "#8b5a2b",
      pointBorderColor: "#fffdf8", pointBorderWidth: 2
    }]},
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false },
        tooltip: { backgroundColor: "#3a2e1f", padding: 10,
          callbacks: { label: c => " " + (c.parsed.y || 0).toFixed(0) + "%" } } },
      scales: {
        y: { beginAtZero: true, max: 100, grid: gridC, ticks: { ...tickC, callback: v => v + "%" } },
        x: { grid: { display: false }, ticks: { ...tickC, maxRotation: 0, autoSkipPadding: 6 } }
      }
    }
  });
}

/* ⭐ NEW — One radar per subject */
function drawSubjectRadars() {
  const grid = $("#radarGrid");

  /* Build/refresh the grid skeleton */
  const isDark = document.body.classList.contains("dark");
  const gridColor = isDark ? "#2a3140" : "#e5d9c0";
  const tickColor = isDark ? "#7a7565" : "#9b8a70";
  const lblColor = isDark ? "#b8a890" : "#6b5842";

  if (!grid.querySelector(".radar-card")) {
    grid.innerHTML = SUBS.map(sub => {
      const s = subjectStats(sub);
      const donePct = s.total ? (s.cnt.c / s.total * 100).toFixed(0) : 0;
      return `<div class="radar-card" data-sub="${esc(sub)}">
        <div class="title" style="color:${SCLR[sub]}">
          <span>● ${esc(sub)}</span>
          <span>${donePct}% done</span>
        </div>
        <div class="rbox"><canvas id="rad-${SUBS.indexOf(sub)}"></canvas></div>
      </div>`;
    }).join("");
  }

  /* Draw or refresh each radar */
  SUBS.forEach((sub, idx) => {
    const cv = document.getElementById("rad-" + idx);
    if (!cv) return;
    const st = subjectStats(sub);
    const allZero = METRICS.every(m => st.pct[m.k] === 0);

    if (charts["rad" + idx]) { charts["rad" + idx].destroy(); charts["rad" + idx] = null; }

    if (allZero && !HAS_CHART) {
      cv.parentElement.innerHTML = '<div class="chart-fallback" style="padding:60px 10px;font-size:12px">No data yet</div>';
      return;
    }

    if (!HAS_CHART) {
      cv.parentElement.innerHTML = '<div class="chart-fallback" style="padding:60px 10px;font-size:12px">📉 Chart.js unavailable</div>';
      return;
    }

    charts["rad" + idx] = new Chart(cv, {
      type: "radar",
      data: {
        labels: METRICS.map(m => m.lbl),
        datasets: [{
          label: sub,
          data: METRICS.map(m => st.pct[m.k]),
          backgroundColor: SCLR[sub] + "44",
          borderColor: SCLR[sub],
          borderWidth: 2,
          pointBackgroundColor: METRICS.map(m => m.color),
          pointBorderColor: "#fffdf8",
          pointBorderWidth: 2,
          pointRadius: 4,
          pointHoverRadius: 6
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: "#3a2e1f", padding: 10,
            callbacks: {
              title: items => METRICS[items[0].dataIndex].full,
              label: c => " " + c.parsed.r.toFixed(0) + "% (" + st.cnt[METRICS[c.dataIndex].k] + "/" + st.total + ")"
            }
          }
        },
        scales: {
          r: {
            beginAtZero: true, max: 100,
            ticks: {
              stepSize: 25, color: tickColor,
              backdropColor: "transparent",
              font: { size: 8 },
              showLabelBackdrop: false,
              callback: v => v + "%"
            },
            grid: { color: gridColor },
            angleLines: { color: gridColor },
            pointLabels: { color: lblColor, font: { size: 10, weight: "600" } }
          }
        }
      }
    });
  });

  /* Update the % done badge live */
  grid.querySelectorAll(".radar-card").forEach(card => {
    const sub = card.dataset.sub;
    const s = subjectStats(sub);
    const donePct = s.total ? (s.cnt.c / s.total * 100).toFixed(0) : 0;
    card.querySelector(".title span:last-child").textContent = donePct + "% done";
  });
}

/* ═══ DASHBOARD ═══ */
function renderDash() {
  const allStats = SUBS.map(s => subjectStats(s));
  const totalChapters = allStats.reduce((a, s) => a + s.total, 0);
  const doneChapters = allStats.reduce((a, s) => a + s.cnt.c, 0);
  const overallPct = totalChapters
    ? allStats.reduce((a, s) => a + s.overall * s.total, 0) / totalChapters : 0;
  const tStat = taskStats('2000-01-01', '2100-01-01');
  const streak = currentStreak();

  $("#stats").innerHTML = `
    <div class="stat"><span class="lb">📚 Overall</span>
      <span class="vl">${overallPct.toFixed(1)}<small>%</small></span>
      <div class="bar"><i style="width:${overallPct}%"></i></div></div>
    <div class="stat"><span class="lb">✅ Chapters Done</span>
      <span class="vl">${doneChapters}<small>/${totalChapters}</small></span>
      <div class="bar"><i style="width:${totalChapters ? doneChapters/totalChapters*100 : 0}%;background:var(--grn)"></i></div></div>
    <div class="stat"><span class="lb">📝 Tasks Done</span>
      <span class="vl">${tStat.done}<small>/${tStat.total}</small></span>
      <div class="bar"><i style="width:${tStat.pct}%"></i></div></div>
    <div class="stat"><span class="lb">🔥 Streak</span>
      <span class="vl">${streak}<small> days</small></span>
      <div class="bar"><i style="width:${Math.min(streak/30*100, 100)}%;background:var(--red)"></i></div></div>`;

  $("#tag").textContent = `${doneChapters} chapters done · ${streak}-day streak`;

  $("#subjBars").innerHTML = SUBS.map(sub => {
    const s = subjectStats(sub);
    const col = SCLR[sub];
    return `<div class="subj-bar">
      <div class="row1">
        <b style="color:${col}">${sub}</b>
        <span>${s.cnt.c}/${s.total} done · ${s.overall.toFixed(0)}% overall</span>
      </div>
      <div class="bar"><i style="width:${s.overall}%;background:${col}"></i></div>
    </div>`;
  }).join("");

  drawTaskChart();
  drawSubjectRadars();
}

/* ═══ CHAPTERS ═══ */
let chFilter = "all";
function renderChapters() {
  let html = "";
  SUBS.forEach(sub => {
    if (chFilter !== "all" && chFilter !== sub) return;
    const s = subjectStats(sub);
    html += `<div class="subj-hdr" data-sub="${esc(sub)}">
      <span style="color:${SCLR[sub]}">● ${esc(sub)}</span>
      <span class="mini">${s.cnt.c}/${s.total} done · ${s.overall.toFixed(0)}%</span>
    </div>`;
    SYL[sub].forEach(name => {
      const st = chState(sub, name);
      const metricsHtml = METRICS.map(m =>
        `<button class="met ${st[m.k] ? 'on' : ''}" data-sub="${esc(sub)}" data-ch="${esc(name)}" data-k="${m.k}" title="${m.full}">${m.lbl}</button>`
      ).join("");
      html += `<div class="ch">
        <span class="nm">${esc(name)}</span>
        <div class="metrics">${metricsHtml}</div>
      </div>`;
    });
  });
  $("#chlist").innerHTML = html;
}

document.addEventListener("click", e => {
  const b = e.target.closest && e.target.closest(".met");
  if (!b) return;
  const sub = b.dataset.sub;
  const ch = b.dataset.ch;
  const k = b.dataset.k;
  const st = chState(sub, ch);
  st[k] = !st[k];
  save();
  b.classList.toggle("on", st[k]);

  /* Live update the subject header */
  const s = subjectStats(sub);
  const hdr = document.querySelector(`.subj-hdr[data-sub="${CSS.escape(sub)}"]`);
  if (hdr) {
    hdr.querySelector(".mini").textContent =
      `${s.cnt.c}/${s.total} done · ${s.overall.toFixed(0)}%`;
  }
});

/* ═══ TASKS ═══ */
let taskRange = "day";

function dateRange(range) {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  let from = new Date(d), to = new Date(d);
  if (range === "week") {
    const day = d.getDay() || 7;
    from.setDate(d.getDate() - day + 1);
    to.setDate(from.getDate() + 6);
  } else if (range === "month") {
    from = new Date(d.getFullYear(), d.getMonth(), 1);
    to = new Date(d.getFullYear(), d.getMonth() + 1, 0);
  } else if (range === "all") {
    from = new Date(2000, 0, 1);
    to = new Date(2100, 0, 1);
  }
  return { from: fmt(from), to: fmt(to) };
}

function renderTasks() {
  const { from, to } = dateRange(taskRange);
  const dates = Object.keys(S.tk).filter(k => k >= from && k <= to && S.tk[k].length).sort();
  const list = $("#tlist");
  if (!dates.length) {
    list.innerHTML = '<div class="empty"><div class="big">📝</div>No tasks in this range</div>';
    return;
  }
  let html = "";
  dates.forEach(dk => {
    const arr = S.tk[dk];
    const done = arr.filter(t => t.done).length;
    const pct = arr.length ? done / arr.length * 100 : 0;
    const dd = new Date(dk + "T00:00:00");
    const lbl = dd.toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short" });
    html += `<div class="date-hdr">${lbl} · ${done}/${arr.length} (${pct.toFixed(0)}%)</div>`;
    arr.forEach(t => {
      html += `<div class="task ${t.done ? 'done' : ''}">
        <button class="chk" data-d="${dk}" data-id="${t.id}">✓</button>
        <span class="tx">${esc(t.text)}</span>
        <button class="del" data-d="${dk}" data-id="${t.id}">×</button>
      </div>`;
    });
  });
  list.innerHTML = html;
}

document.addEventListener("click", e => {
  const c = e.target.closest && e.target.closest(".chk");
  if (c && c.dataset.d) {
    const arr = S.tk[c.dataset.d] || [];
    const t = arr.find(x => x.id === c.dataset.id);
    if (t) { t.done = !t.done; save(); renderTasks(); }
    return;
  }
  const d = e.target.closest && e.target.closest(".del");
  if (d && d.dataset.d) {
    if (!confirm("Delete this task?")) return;
    S.tk[d.dataset.d] = (S.tk[d.dataset.d] || []).filter(x => x.id !== d.dataset.id);
    if (!S.tk[d.dataset.d].length) delete S.tk[d.dataset.d];
    save();
    renderTasks();
  }
});

/* ═══ EVENTS ═══ */
$("#add").onclick = () => {
  const text = $("#ti").value.trim();
  if (!text) { $("#ti").focus(); return; }
  const dk = $("#td").value || today();
  (S.tk[dk] = S.tk[dk] || []).push({ id: Date.now().toString(36), text, done: false });
  save();
  $("#ti").value = "";
  $("#ti").focus();
  renderTasks();
};
$("#ti").onkeydown = e => { if (e.key === "Enter") $("#add").click(); };
$("#td").value = today();

$$("[data-range]").forEach(b => b.onclick = () => {
  $$("[data-range]").forEach(x => x.classList.remove("on"));
  b.classList.add("on");
  taskRange = b.dataset.range;
  renderTasks();
});

$$("[data-fsub]").forEach(b => b.onclick = () => {
  $$("[data-fsub]").forEach(x => x.classList.remove("on"));
  b.classList.add("on");
  chFilter = b.dataset.fsub;
  renderChapters();
});

$$("nav button").forEach(b => b.onclick = () => {
  $$(".panel").forEach(p => p.classList.remove("on"));
  $$("nav button").forEach(x => x.classList.remove("on"));
  $("#" + b.dataset.t).classList.add("on");
  b.classList.add("on");
  if (b.dataset.t === "dash") renderDash();
  if (b.dataset.t === "ch") renderChapters();
  if (b.dataset.t === "tk") renderTasks();
  window.scrollTo({ top: 0, behavior: "smooth" });
});

/* THEME */
function applyTheme() {
  const dark = localStorage.getItem("theme") === "dark";
  document.body.classList.toggle("dark", dark);
  $("#themeBtn").textContent = dark ? "☀️" : "🌙";
}
$("#themeBtn").onclick = () => {
  const dark = !document.body.classList.contains("dark");
  localStorage.setItem("theme", dark ? "dark" : "light");
  applyTheme();
  if (HAS_CHART) {
    Chart.defaults.color = dark ? "#7a7565" : "#9b8a70";
    Object.values(charts).forEach(c => {
      if (!c) return;
      try {
        if (c.options.plugins && c.options.plugins.legend && c.options.plugins.legend.labels) {
          c.options.plugins.legend.labels.color = dark ? "#b8a890" : "#6b5842";
        }
        if (c.options.scales) {
          const g = dark ? "#2a3140" : "#e5d9c0";
          const t = dark ? "#7a7565" : "#9b8a70";
          if (c.options.scales.x) {
            c.options.scales.x.grid.color = g;
            c.options.scales.x.ticks.color = t;
          }
          if (c.options.scales.y) {
            c.options.scales.y.grid.color = g;
            c.options.scales.y.ticks.color = t;
          }
          if (c.options.scales.r) {
            c.options.scales.r.grid.color = g;
            c.options.scales.r.angleLines.color = g;
            c.options.scales.r.pointLabels.color = dark ? "#b8a890" : "#6b5842";
            c.options.scales.r.ticks.color = t;
          }
        }
        c.update();
      } catch(e) {}
    });
  }
};

/* EXPORT / IMPORT */
$("#exp").onclick = () => {
  const b = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b);
  a.download = "study-backup-" + today() + ".json";
  a.click();
  URL.revokeObjectURL(a.href);
  toast("✓ Backup downloaded");
};
$("#imp").onclick = () => $("#file").click();
$("#file").onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      const d = JSON.parse(ev.target.result);
      if (!d.ch && !d.tk) throw 0;
      if (!confirm("Replace all current data?")) return;
      localStorage.setItem(KEY, JSON.stringify(d));
      location.reload();
    } catch(e) { alert("Invalid file"); }
  };
  r.readAsText(f);
  e.target.value = "";
};

/* Clean orphaned data */
function cleanupOrphans() {
  const validSubs = new Set(SUBS);
  let changed = false;
  Object.keys(S.ch).forEach(k => {
    const sub = k.split("|")[0];
    if (!validSubs.has(sub)) { delete S.ch[k]; changed = true; }
  });
  Object.keys(S.tk).forEach(k => {
    const before = (S.tk[k] || []).length;
    S.tk[k] = (S.tk[k] || []).filter(t => t && t.id && t.text);
    if (S.tk[k].length !== before) changed = true;
    if (!S.tk[k].length) { delete S.tk[k]; changed = true; }
  });
  if (changed) save();
}

/* Midnight date sync */
setInterval(() => {
  const td = $("#td");
  if (td && td.value < today()) td.value = today();
}, 60000);

/* Chart.js fallback */
function showChartFallback() {
  document.querySelectorAll(".chartbox").forEach(c => {
    c.innerHTML = '<div class="chart-fallback">📉 Charts unavailable<br><small>Chart.js CDN could not load</small></div>';
  });
}

/* ═══ INIT ═══ */
applyTheme();
cleanupOrphans();
if (!HAS_CHART) showChartFallback();
renderDash();
console.log("✓ Study Tracker ready. Charts:", HAS_CHART ? "✓" : "✗");
</script>
</body>
